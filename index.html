<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Turn direct thoughts into polished LinkedIn language with Brofessional." />
    <meta name="theme-color" content="#edf3f8" />
    <title>Brofessional — LinkedIn speak, translated</title>
    <link rel="stylesheet" href="styles.css?v=13" />
  </head>
  <body>
    <!--
      FORM SEED: user-pinned reference / linkedin-translator-2026-09-10 (the explicit brief overrides a concept roll).
      WORLD: Editorial translation desk — one pale blue-gray canvas split into two open work zones; LinkedIn blue marks action and provenance.
      FIRST VIEWPORT: A compact proposition hands the viewport immediately to the working translator on desktop and mobile.
      VISITOR PATH: Write candidly, translate, read the paired turn, then refine through a compact follow-up composer.
      SIGNATURE INTERACTION: A blue signal crosses the center rail as the destination resolves.
      CROSS-SURFACE: Paper, ink, restrained blue, direct copy, and paired turns govern empty, loading, error, and history states.
      HONEST RISK: Familiar translator geometry can feel utilitarian; editorial type scale and the live rail carry distinctiveness.
      MOTION: One center-rail transfer; all other state changes remain quiet.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <header class="masthead">
      <a class="brand" href="./" aria-label="Brofessional home">
        <span class="brand-mark" aria-hidden="true">Bro</span>
      </a>
      <button class="icon-button" id="clear-button" type="button" aria-label="Clear conversation" title="Clear conversation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" /></svg>
      </button>
    </header>

    <main>
      <section class="translator" aria-label="LinkedIn language translator">
        <article class="panel input-panel">
          <div class="panel-heading">
            <label id="input-label" for="message">Detect language</label>
            <span id="character-count">0 / 1,000</span>
          </div>
          <textarea id="message" maxlength="1000" placeholder="My colleague keeps scheduling meetings that should have been emails…" autofocus></textarea>
          <div class="panel-footer">
            <div class="translate-actions">
              <div class="tone-picker" id="tone-picker" role="group" aria-labelledby="tone-label" hidden>
                <span class="tone-label" id="tone-label">Tone</span>
                <div class="tone-options">
                  <label><input type="radio" name="tone" value="normal" checked /><span>Normal</span></label>
                  <label><input type="radio" name="tone" value="real" /><span>Real meaning</span></label>
                </div>
              </div>
              <button class="primary-button" id="send-button" type="button">
                <span>Translate</span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z" /></svg>
              </button>
            </div>
          </div>
        </article>

        <button class="swap-button" id="swap-button" type="button" aria-label="Reverse translation direction" title="Reverse translation direction">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 3-3m-3 3 3 3M7 7h10M17 17l-3 3m3-3-3-3m3 3H7" /></svg>
        </button>

        <article class="panel output-panel" aria-live="polite" aria-busy="false">
          <div class="panel-heading">
            <span id="output-label">Brofessionalize</span>
            <label class="sr-only" for="target-language">Translate into</label>
            <span class="language-picker" id="language-picker" hidden>
              <select id="target-language">
                <option value="English">English</option>
                <option value="Simplified Chinese">简体中文</option>
                <option value="Traditional Chinese">繁體中文</option>
                <option value="Spanish">Español</option>
                <option value="French">Français</option>
                <option value="German">Deutsch</option>
                <option value="Japanese">日本語</option>
                <option value="Korean">한국어</option>
                <option value="Portuguese">Português</option>
              </select>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg>
            </span>
            <button class="copy-button" id="copy-button" type="button" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h11v11H8zM5 16H4V5h11v1" /></svg>
              <span>Copy</span>
            </button>
          </div>
          <div class="output" id="output">
            <div class="empty-state">
              <p>Your professionally polished translation will appear here.</p>
            </div>
          </div>
          <details class="history" id="history" hidden>
            <summary><span>History</span><span id="history-count">0</span></summary>
            <div class="history-list" id="history-list"></div>
          </details>
          <button class="refine-toggle" id="refine-toggle" type="button" aria-label="Refine translation" aria-controls="followup-form" aria-expanded="false" title="Refine translation" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.6-10.6a2.1 2.1 0 0 0-3-3L5.2 16 4 20Zm10.3-13.1 2.8 2.8" /></svg>
          </button>
          <form class="followup" id="followup-form" hidden>
            <label class="sr-only" for="followup">Refine the translation</label>
            <input id="followup" maxlength="500" placeholder="Make it shorter, warmer, or more direct…" />
            <button type="submit" aria-label="Send refinement">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4 14-3-6-7-1Z" /></svg>
            </button>
          </form>
          <div class="status" id="status" role="status"></div>
        </article>
      </section>
    </main>

    <script src="app.js?v=13"></script>
  </body>
</html>
